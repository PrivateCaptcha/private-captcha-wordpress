name: CI

on:
  push:
    branches:
    - '**'
    tags:
    - 'v*'
    paths-ignore:
    - 'docs/**'
    - '**.md'
    - '**/.*.yml'
    - '.vscode/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.4']

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, json, tokenizer
        coverage: none

    - name: Install dependencies
      run: make install-dev
      working-directory: private-captcha

    - name: Lint code
      run: make lint
      working-directory: private-captcha

    - name: Analyze code
      run: make analyze
      working-directory: private-captcha

    - name: Check WordPress coding standards
      run: make wpcs
      working-directory: private-captcha

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    environment: E2E tests
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Configure e2e credentials
      env:
        PC_API_KEY: ${{ secrets.PC_E2E_API_KEY }}
        PC_SITEKEY: ${{ secrets.PC_E2E_SITEKEY }}
      run: |
        umask 077
        cp docker/.env.e2e.example docker/.env.e2e
        : "${PC_API_KEY:?Set the PC_E2E_API_KEY secret in the e2e environment}"
        : "${PC_SITEKEY:?Set the PC_E2E_SITEKEY secret in the e2e environment}"
        printf 'PC_API_KEY=%s\nPC_SITEKEY=%s\n' "$PC_API_KEY" "$PC_SITEKEY" > docker/.env.e2e

    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.3'
        extensions: curl
        coverage: none

    - name: Install plugin dependencies
      run: make install
      working-directory: private-captcha

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Install Playwright dependencies
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Start and provision WordPress
      run: make run-e2e

    - name: Run WPForms e2e tests
      run: make test-e2e

    - name: Collect container logs
      if: failure()
      run: docker compose -p private-captcha-wordpress-e2e -f docker/docker-compose.e2e.yml logs --no-color > e2e-docker.log

    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wpforms-e2e-failure
        path: |
          test-results/
          e2e-docker.log
        retention-days: 7

    - name: Stop e2e stack
      if: always()
      run: make stop-e2e

  package:
    runs-on: ubuntu-latest
    needs: e2e
    if: success()

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        coverage: none
        tools: wp-cli
        update: true

    - name: Set Composer root version from tag
      if: github.ref_type == 'tag'
      run: |
        # Normalize tag for Composer: convert trailing -N to .N (e.g. v1.0.14-3 → v1.0.14.3)
        # because Composer rejects bare numbers after a hyphen.
        VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/-([0-9]+)$/.\1/')
        echo "COMPOSER_ROOT_VERSION=${VERSION}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: make install
      working-directory: private-captcha

    - name: Run plugin check
      uses: wordpress/plugin-check-action@18573eb38f13543484a1f095672dae3849a4fbb0 # v1.1.6
      continue-on-error: true
      with:
        build-dir: './private-captcha'
        exclude-files: |
          .distignore

    - name: Install latest version of dist-archive-command
      run: |
        composer require --dev wp-cli/dist-archive-command

    - name: Build plugin
      run: |
        ./vendor/bin/wp dist-archive ./private-captcha private-captcha.zip

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wp-plugin
        path: private-captcha.zip
        retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: package
    if: success() && github.ref_type == 'tag'
    environment: GitHub release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wp-plugin

      - name: Display downloaded files
        run: ls -R .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "Release ${RELEASE_TAG}" \
            --notes "Automated release for ${RELEASE_TAG}" \
            private-captcha.zip
